[workspace]
members = [
    "crates/needle-core",
    "crates/needle-cli",
    "crates/needle-browser-host",
]
resolver = "2"

[workspace.package]
version = "0.9.2"
edition = "2021"
authors = ["needle contributors"]
license = "MIT"
repository = "https://github.com/icebli/needle"

[workspace.dependencies]
# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.0"

# Async
tokio = { version = "1.53.1", features = ["full"] }

# HTTP
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }

# Fuzzy matching
strsim = "0.11.1"
unicode-normalization = "0.1.25"

# Regex
regex = "1.13.1"

# Paths / dirs
directories = "6.0.0"
url = "2.5.8"

# Error handling
anyhow = "1.0.104"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Audio tagging
lofty = "0.25.1"
