<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Needle</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="brand">
          <img src="icons/needle.svg" alt="" width="34" height="34">
          <h1>Needle</h1>
        </div>
        <button id="settings-button" class="icon-button" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5ZM19.1 13.5l1.15 1.1-2 3.46-1.53-.44a7.9 7.9 0 0 1-2.22 1.28L14.12 20h-4.24l-.38-1.1a7.9 7.9 0 0 1-2.22-1.28l-1.53.44-2-3.46 1.15-1.1a8.25 8.25 0 0 1 0-3l-1.15-1.1 2-3.46 1.53.44A7.9 7.9 0 0 1 9.5 5.1L9.88 4h4.24l.38 1.1a7.9 7.9 0 0 1 2.22 1.28l1.53-.44 2 3.46-1.15 1.1a8.25 8.25 0 0 1 0 3Z"/></svg>
        </button>
      </header>

      <section id="download-panel" class="panel">
        <label class="field">
          <span>Artist</span>
          <input id="artist" autocomplete="off" placeholder="Artist name">
        </label>
        <label class="field">
          <span>Title</span>
          <input id="title" autocomplete="off" placeholder="Track title">
        </label>

        <a id="source-link" class="source" href="#" target="_blank" rel="noreferrer">
          <span class="source-mark" aria-hidden="true">▶</span>
          <span class="source-copy">
            <strong id="source-site">Current page</strong>
            <small id="source-url">Detecting track…</small>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>
        </a>

        <button id="download-button" class="primary" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
          <span>Download with Needle</span>
        </button>
        <label class="check-row">
          <input id="playlist-check" type="checkbox" checked>
          <span>Add to Needle playlist</span>
        </label>
      </section>

      <section id="settings-panel" class="panel settings" hidden>
        <button id="back-button" class="back-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span>Settings</span>
        </button>
        <label class="field">
          <span>Playlist name</span>
          <input id="playlist-name" value="Needle" autocomplete="off">
        </label>
        <label class="toggle-row">
          <span>Spotify playlist sync</span>
          <input id="playlist-enabled" type="checkbox" checked role="switch">
        </label>
        <div class="setting-group">
          <span>Native host</span>
          <button id="doctor-button" class="secondary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H4zM8 21h8M12 17v4"/></svg>
            <span>Check connection</span>
          </button>
        </div>
      </section>

      <footer class="status" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Checking Needle bridge…</span>
        <span id="status-spinner" class="spinner" hidden></span>
      </footer>
    </main>
    <script src="browser-compat.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
